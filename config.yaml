name: "FUXA Upstream Test"
description: "Official FUXA 1.2.11 test instance for safe migration"
image: "frangoteam/fuxa"
version: "1.2.11"
slug: "fuxa_upstream_test"
webui: "http://[HOST]:[PORT:1882]/home"
panel_icon: mdi:monitor-dashboard
panel_title: FUXA Test
environment:
  LOG_LEVEL: "info"
options: {}
schema: {}
init: false
arch:
  - amd64
map:
  - type: addon_config
    read_only: false
    path: /usr/src/app/FUXA/server/_appdata
  - type: addon_config
    read_only: false
    path: /usr/src/app/FUXA/server/_db
  - type: addon_config
    read_only: false
    path: /usr/src/app/FUXA/server/_images
  - type: addon_config
    read_only: false
    path: /usr/src/app/FUXA/server/_logs
startup: services
ports:
  1881/tcp: 1882
