name: PCS 7 Bridge
slug: pcs7_bridge
description: Manage approved Home Assistant to PCS 7 telemetry mappings from Home Assistant.
version: 0.2.7
url: https://github.com/bdwalker43/PCS7-Bridge
arch:
  - amd64
startup: application
boot: manual
init: false
panel_icon: mdi:transit-connection-variant
panel_title: PCS 7 Bridge
ingress: true
ingress_port: 8099
homeassistant_api: true
options:
  plc_host: 192.168.40.200
  rack: 0
  slot: 3
  poll_interval_s: 5
  write_enabled: false
  commands_enabled: false
  command_poll_ms: 500
  command_max_risk_tier: 1
schema:
  plc_host: str
  rack: int(0,7)
  slot: int(0,31)
  poll_interval_s: int(1,60)
  write_enabled: bool
  commands_enabled: bool
  command_poll_ms: int(100,10000)
  command_max_risk_tier: int(1,3)
